<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple To-Do List</title>
</head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  background: #f4f6f8;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  background: #ffffff;
  width: 100%;
  max-width: 400px;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0);
}


header {
  margin-bottom: 15px;
}

#title {
  font-size: 24px;
  margin-bottom: 5px;
}

.lead {
  color: #666;
  font-size: 14px;
}

.add {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

#taskInput {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

#taskInput:focus {
  outline: none;
  border-color: #4f46e5;
}

.addBtn {
  padding: 10px 14px;
  border: none;
  border-radius: 6px;
  background: #4f46e5;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

.addBtn:hover {
  background: #4338ca;
}

.tasks {
  list-style: none;
  margin-bottom: 10px;
}

.tasks li {
  padding: 10px;
  background: #f1f5f9;
  border-radius: 6px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
}

.empty {
  text-align: center;
  color: #888;
  font-size: 14px;
  margin: 10px 0;
}


footer {
  margin-top: 10px;
  text-align: right;
  font-size: 13px;
  color: #555;
}

</style>
<body>
  <main class="app">
    <header>
      <div>
        <h1 id="title">To-Do List</h1>
        <p class="lead">Add task.</p>
      </div>
    </header>

    <form id="addForm" class="add" aria-label="Add task">
      <input id="taskInput" type="text" placeholder="What do you want to do?" autocomplete="off" aria-label="Task text" />
      <button id="addBtn" class="addBtn" type="submit">Add</button>
    </form>

    <ul id="taskList" class="tasks"></ul>
    <div id="empty" class="empty" hidden>No tasks yet — add your first task!</div>

    <footer>
      <div id="count">0 tasks</div>
    </footer>
  </main>
    <script src="./index.js"></script>
</body>
</html>
